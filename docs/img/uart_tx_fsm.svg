  <text x="417" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <rect x="460" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="497" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  <rect x="540" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="577" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <rect x="620" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="657" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  <rect x="700" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="737" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <rect x="780" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="817" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  <rect x="860" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="897" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <rect x="940" y="676" width="74" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="977" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
  <rect x="1020" y="676" width="74" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1057" y="714.1" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  <text x="337" y="756" font-size="16" fill="#475569" text-anchor="middle">9</text>
  <text x="337" y="780" font-size="16" fill="#475569" text-anchor="middle">stop</text>
  <text x="417" y="756" font-size="16" fill="#475569" text-anchor="middle">8</text>
  <text x="417" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d7</text>
  <text x="497" y="756" font-size="16" fill="#475569" text-anchor="middle">7</text>
  <text x="497" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d6</text>
  <text x="577" y="756" font-size="16" fill="#475569" text-anchor="middle">6</text>
  <text x="577" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d5</text>
  <text x="657" y="756" font-size="16" fill="#475569" text-anchor="middle">5</text>
  <text x="657" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d4</text>
  <text x="737" y="756" font-size="16" fill="#475569" text-anchor="middle">4</text>
  <text x="737" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d3</text>
  <text x="817" y="756" font-size="16" fill="#475569" text-anchor="middle">3</text>
  <text x="817" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d2</text>
  <text x="897" y="756" font-size="16" fill="#475569" text-anchor="middle">2</text>
  <text x="897" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d1</text>
  <text x="977" y="756" font-size="16" fill="#475569" text-anchor="middle">1</text>
  <text x="977" y="780" font-size="16" fill="#475569" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">d0</text>
  <text x="1057" y="756" font-size="16" fill="#475569" text-anchor="middle">0</text>
  <text x="1057" y="780" font-size="16" fill="#475569" text-anchor="middle">start</text>
  <path d="M 1098 705 L 1178 705" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="1190" y="713" font-size="24" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace">tx_o</text>
  <text x="300" y="842" font-size="22" fill="#0f172a">Hatta sıra: start, d0 … d7 (LSB önce), stop → 0 1 1 0 1 0 1 0 1 1</text>
</svg>
