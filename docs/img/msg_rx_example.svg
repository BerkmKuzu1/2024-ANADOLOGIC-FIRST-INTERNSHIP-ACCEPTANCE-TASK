<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>msg_rx örneği: BA CD 00 10 00 20 00 49 mesajında her durum ve sum değeri</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="80" font-size="40" font-weight="700" fill="#0f172a"><tspan font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace">msg_rx</tspan> · örnek mesaj BA CD 00 10 00 20 00 49</text>
  <text x="60" y="120" font-size="22" fill="#475569">Çipte gelen bayt ve eklendikten sonraki sum var · checksum baytıyla toplam 00 olunca mesaj geçerli</text>
  <!-- states -->
  <rect x="180" y="280" width="240" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="300" y="326" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_HEADER_H</text>
  <text x="300" y="356" font-size="18" fill="#475569" text-anchor="middle">0xBA bekle</text>
  <rect x="540" y="280" width="240" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="660" y="326" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_HEADER_L</text>
  <text x="660" y="356" font-size="18" fill="#475569" text-anchor="middle">0xCD bekle</text>
  <rect x="900" y="280" width="240" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1020" y="326" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_NUM1_H</text>
  <text x="1020" y="356" font-size="18" fill="#475569" text-anchor="middle">num1[15:8]</text>
  <rect x="1260" y="280" width="240" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1380" y="326" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_NUM1_L</text>
  <text x="1380" y="356" font-size="18" fill="#475569" text-anchor="middle">num1[7:0]</text>
  <rect x="1260" y="600" width="240" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1380" y="646" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_NUM2_H</text>
  <text x="1380" y="676" font-size="18" fill="#475569" text-anchor="middle">num2[15:8]</text>
  <rect x="900" y="600" width="240" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1020" y="646" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_NUM2_L</text>
  <text x="1020" y="676" font-size="18" fill="#475569" text-anchor="middle">num2[7:0]</text>
  <rect x="540" y="600" width="240" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="660" y="646" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_OPCODE</text>
  <text x="660" y="676" font-size="18" fill="#475569" text-anchor="middle">opcode</text>
  <rect x="180" y="600" width="240" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="300" y="646" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">S_CHECKSUM</text>
  <text x="300" y="676" font-size="18" fill="#475569" text-anchor="middle">sum + bayt = 0 ?</text>
  <!-- transitions -->
  <circle cx="60" cy="305" r="11" fill="#0f172a"/>
  <path d="M 72 305 L 178 305" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="119" y="289" font-size="20" fill="#475569" text-anchor="middle">rst</text>
  <path d="M 270 280 C 240 190, 360 190, 330 280" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="300" y="192" font-size="20" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">0xBA değil</text>
  <path d="M 630 280 C 600 190, 720 190, 690 280" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="660" y="192" font-size="20" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">yine 0xBA</text>
  <path d="M 420 312 L 538 312" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="480" y="298" font-size="20" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">0xBA</text>
  <path d="M 540 350 L 422 350" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="480" y="377" font-size="19" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">başka bayt</text>
  <path d="M 780 330 L 898 330" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="840" y="316" font-size="20" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">0xCD</text>
  <path d="M 1140 330 L 1258 330" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 1500 330 H 1550 V 650 H 1502" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 1260 650 L 1142 650" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 900 650 L 782 650" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 540 650 L 422 650" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 180 650 H 110 V 355 H 178" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-ok)"/>
  <text x="128" y="486" font-size="18" fill="#15803d" text-anchor="start" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">sum + bayt = 0 ise</text>
  <text x="128" y="512" font-size="20" fill="#15803d" font-weight="700" text-anchor="start" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">valid_o = 1</text>
  <text x="128" y="538" font-size="18" fill="#475569" text-anchor="start" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">değilse mesaj atılır</text>
  <!-- example: byte and sum after each state -->
  <rect x="205" y="400" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="227" cy="422" r="13" fill="#0f172a"/>
  <text x="227" y="428" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="249" y="429" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">BA</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">BA</tspan></text>
  <rect x="565" y="400" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="587" cy="422" r="13" fill="#0f172a"/>
  <text x="587" y="428" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="609" y="429" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">CD</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">87</tspan></text>
  <rect x="925" y="400" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="947" cy="422" r="13" fill="#0f172a"/>
  <text x="947" y="428" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="969" y="429" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">00</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">87</tspan></text>
  <rect x="1285" y="400" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1307" cy="422" r="13" fill="#0f172a"/>
  <text x="1307" y="428" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="1329" y="429" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">10</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">97</tspan></text>
  <rect x="1285" y="720" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1307" cy="742" r="13" fill="#0f172a"/>
  <text x="1307" y="748" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="1329" y="749" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">00</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">97</tspan></text>
  <rect x="925" y="720" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="947" cy="742" r="13" fill="#0f172a"/>
  <text x="947" y="748" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="969" y="749" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">20</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">B7</tspan></text>
  <rect x="565" y="720" width="190" height="44" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="587" cy="742" r="13" fill="#0f172a"/>
  <text x="587" y="748" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
  <text x="609" y="749" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">00</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#0f172a">B7</tspan></text>
  <rect x="205" y="720" width="190" height="44" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <circle cx="227" cy="742" r="13" fill="#0f172a"/>
  <text x="227" y="748" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
  <text x="249" y="749" font-size="19" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" fill="#0f172a"><tspan font-weight="700">49</tspan><tspan fill="#475569"> → sum </tspan><tspan font-weight="700" fill="#15803d">00 ✓</tspan></text>
  <text x="60" y="818" font-size="20" fill="#475569">num1 = 0x0010 = 16 · num2 = 0x0020 = 32 · opcode = 00 (toplama)</text>
  <text x="60" y="852" font-size="21" fill="#15803d" font-weight="700">sum = 00 → valid_o = 1 → alu: 16 + 32 = 48 → cevap AB CD 00 30 58</text>
</svg>
