<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Veri yolu: rx_i, uart_rx, msg_rx, alu, msg_tx, uart_tx, tx_o</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="80" font-size="40" font-weight="700" fill="#0f172a">Veri yolu</text>
  <text x="60" y="120" font-size="22" fill="#475569">Bitler bayta, baytlar mesaja, mesaj sonuca, sonuç yeniden bitlere dönüşür</text>
  <!-- top -->
  <rect x="290" y="210" width="1170" height="530" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="316" y="250" font-size="24" fill="#475569" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace">top</text>
  <text x="316" y="718" font-size="18" fill="#475569">clk ve rst bütün modüllere gider</text>
  <!-- blocks -->
  <rect x="90" y="300" width="120" height="60" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="150" y="338.4" font-size="24" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">rx_i</text>
  <rect x="90" y="590" width="120" height="60" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
