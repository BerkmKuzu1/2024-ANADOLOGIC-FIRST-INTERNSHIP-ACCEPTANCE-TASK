  <text x="582" y="833.65" font-size="19" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">chk</text>
  <text x="760" y="792" font-size="18" fill="#475569">Cevap · 5 bayt</text>
  <rect x="760" y="804" width="64" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="792" y="833.65" font-size="19" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">AB</text>
  <rect x="830" y="804" width="64" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
