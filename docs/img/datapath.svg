  <text x="1290" y="501" font-size="18" fill="#475569" text-anchor="middle">toplama / çıkarma</text>
  <rect x="750" y="565" width="220" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="860" y="616" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">msg_tx</text>
  <text x="860" y="646" font-size="18" fill="#475569" text-anchor="middle">sonuç → 5 bayt</text>
  <rect x="340" y="565" width="220" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="450" y="616" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">uart_tx</text>
  <text x="450" y="646" font-size="18" fill="#475569" text-anchor="middle">bayt → bit</text>
