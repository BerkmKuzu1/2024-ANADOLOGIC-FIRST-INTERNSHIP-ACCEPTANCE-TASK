  <rect x="340" y="275" width="220" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="450" y="326" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">uart_rx</text>
  <text x="450" y="356" font-size="18" fill="#475569" text-anchor="middle">bit → bayt</text>
  <rect x="750" y="275" width="220" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="860" y="326" font-size="26" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">msg_rx</text>
