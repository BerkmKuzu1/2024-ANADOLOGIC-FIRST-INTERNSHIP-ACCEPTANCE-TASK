  <rect x="900" y="804" width="134" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="967" y="833.65" font-size="19" fill="#0f172a" font-weight="700" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">result</text>
  <rect x="1040" y="804" width="64" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
